site_name: Révisions EFREI — P2-PLUS
site_description: Notes de cours, TD et fiches de révision (EFREI, P2-PLUS)
site_url: https://yarushimow.github.io/P2-PLUS/
repo_url: https://github.com/yarushimow/P2-PLUS
repo_name: yarushimow/P2-PLUS
edit_uri: edit/main/docs/

# Pas de clé `nav` : la navigation est générée depuis l'arborescence de docs/.
# Les fichiers `.pages` (plugin awesome-pages) donnent les titres et l'ordre.

# Fichiers présents dans docs/ mais jamais publiés
exclude_docs: |
  _*.md
  pdf/
  *.pdf

theme:
  name: material
  language: fr
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Passer en mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Suivre le thème du système
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: fr
  - awesome-pages

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/agenda.js
  - javascripts/titre-accueil.js
  - javascripts/menu.js
  - javascripts/simulateur-proba.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/theme.css
  - stylesheets/extra.css
