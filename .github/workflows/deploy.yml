name: Déployer le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Chaque nuit à 4 h UTC : remet l'agenda à jour
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Adresse iCal de l'emploi du temps Efrei (Settings → Secrets → Actions)
      EFREI_ICS_URL: ${{ secrets.EFREI_ICS_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer MkDocs
        run: pip install -r requirements.txt

      - name: Synchroniser l'agenda Efrei
        # Sans le secret EFREI_ICS_URL, on garde docs/data/calendrier.json tel quel
        if: env.EFREI_ICS_URL != '' && github.event_name != 'pull_request'
        run: python outils/sync_calendrier.py || echo "::warning::Synchronisation de l'agenda impossible, données précédentes conservées"

      - name: Construire le site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Les PR vérifient seulement que le site compile ; on ne publie que depuis main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
